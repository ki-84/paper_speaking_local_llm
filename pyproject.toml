[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperspeak-linux"
version = "0.1.0"
description = "A private paper radio and English practice studio"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "python-multipart>=0.0.20", "beautifulsoup4>=4.13",
  "lxml>=5.3", "pymupdf>=1.25", "numpy>=2,<3", "soundfile>=0.13",
  "huggingface-hub>=0.34,<1", "imageio-ffmpeg>=0.6", "cmudict>=1.1",
  "num2words>=0.5", "fsrs==6.3.2", "pytest>=8", "pytest-asyncio>=0.25"
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
paperspeak = ["*.gbnf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "E731", "E741"]
